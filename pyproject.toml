[tool.uv.workspace]
members = ["packages/*"]

[project]
name = "folio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "folio-core",
    "folio-mcp",
    "folio-sync",
]

[tool.uv.sources]
folio-core = { workspace = true }
folio-mcp = { workspace = true }
folio-sync = { workspace = true }

[dependency-groups]
dev = [
    "awscli>=1.45.9",
    "awscli-local>=0.22.2",
    "chainlit>=2.11.1",
    "litellm>=1.85.0",
    "localstack>=2026.4.0",
    "mcp>=1.27.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.13",
    "ty>=0.0.36",
]
