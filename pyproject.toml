[tool.uv.workspace]
members = ["packages/*"]

[project]
name = "folio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "folio-chat",
    "folio-core",
    "folio-mcp",
    "folio-sync",
    "sqlite-vec>=0.1.9",
]

[tool.uv.sources]
folio-chat = { workspace = true }
folio-core = { workspace = true }
folio-mcp = { workspace = true }
folio-sync = { workspace = true }

[dependency-groups]
dev = [
    "chainlit>=2.11.1",
    "litellm>=1.85.0",
    "mcp>=1.27.1",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.13",
    "ty>=0.0.36",
]

[tool.coverage.run]
source = ["folio_core", "folio_sync", "folio_mcp"]
omit = [
    "*/config.py",
    "*/db.py",
    "*/s3_client.py",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
