[project]
name = "folio-sync"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dynaconf>=3.2.13",
    "folio-core",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
folio-sync = "folio_sync.shell.cli:main"

[tool.uv.sources]
folio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
