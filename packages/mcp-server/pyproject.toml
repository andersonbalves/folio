[project]
name = "folio-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dynaconf>=3.2.13",
    "fastmcp>=3.3.1",
    "folio-core",
    "folio-embeddings",
    "structlog>=25.5.0",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
folio-mcp = "folio_mcp.shell.handler:main"

[tool.uv.sources]
folio-core = { workspace = true }
folio-embeddings = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
