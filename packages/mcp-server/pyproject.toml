[project]
name = "folio-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dynaconf>=3.2.13",
    "fastmcp>=3.3.1",
    "folio-core",
    "psycopg[binary,pool]>=3.3.4",
    "structlog>=25.5.0",
]

[project.scripts]
folio-mcp = "folio_mcp.handler:main"

[tool.uv.sources]
folio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
