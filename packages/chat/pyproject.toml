[project]
name = "folio-chat"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chainlit>=2.11.1",
    "dynaconf>=3.2.13",
    "fastmcp>=3.3.1",
    "litellm>=1.85.0",
    "mcp>=1.27.1",
    "ollama",
]

[tool.uv.sources]
folio-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
