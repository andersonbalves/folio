[project]
name = "folio-embeddings"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "folio-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
openai = ["openai>=1.0"]

[tool.uv.sources]
folio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
