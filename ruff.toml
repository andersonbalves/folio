# Ruff configuration - Strict & Secure
# https://docs.astral.sh/ruff/settings/

line-length = 100
target-version = "py314"

[lint]
# E: pycodestyle errors, F: Pyflakes, I: isort, N: pep8-naming, W: pycodestyle warnings
# UP: pyupgrade, B: flake8-bugbear, SIM: flake8-simplify, RET: flake8-return
# PTH: flake8-use-pathlib, T20: flake8-print, D: pydocstyle (Google convention)
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET", "PTH", "T20", "D"]
ignore = []

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"packages/*/tests/*.py" = ["D"]

[lint.isort]
known-first-party = ["folio"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
